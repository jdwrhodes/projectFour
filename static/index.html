<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake — projectFour</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #4ade80;
      --accent-dark: #166534;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .layout {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
    }

    .game-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .title-row {
      position: relative;
      width: 100%;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .icon-btn {
      position: absolute;
      right: 0;
      top: -0.2rem;
      padding: 0.2rem 0.45rem;
      font-size: 1rem;
    }

    .board-wrap {
      position: relative;
    }

    #board {
      display: block;
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 6px;
    }

    .overlay-card {
      text-align: center;
      padding: 1rem 2rem;
    }

    .overlay-card h2 {
      margin: 0 0 0.25rem;
      font-size: 1.4rem;
    }

    #overlay-score {
      margin: 0 0 1rem;
      color: var(--muted);
    }

    #save-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    #save-form label {
      color: var(--muted);
      font-size: 0.85rem;
    }

    #save-form input {
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }

    button {
      font: inherit;
      padding: 0.45rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    button.primary:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .status {
      min-height: 1.2em;
      margin: 0.5rem 0;
      font-size: 0.85rem;
      color: var(--accent);
    }

    .power-status {
      margin: 0.75rem 0 0;
      min-height: 1.1em;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .hint {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .scoreline {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .scoreline span {
      color: var(--text);
      font-weight: 600;
    }

    .scores-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      width: 220px;
    }

    .scores-panel h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    #highscores {
      list-style-position: inside;
      margin: 0;
      padding: 0;
    }

    #highscores li {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--border);
    }

    #highscores li:last-child {
      border-bottom: none;
    }

    #highscores .score {
      font-weight: 600;
      color: var(--accent);
    }

    #highscores .empty {
      justify-content: center;
      color: var(--muted);
      border-bottom: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="game-panel">
      <div class="title-row">
        <h1>Snake</h1>
        <button id="mute-btn" class="icon-btn" title="Sound on — press M to mute">🔊</button>
      </div>
      <div class="board-wrap">
        <canvas id="board" width="400" height="400"></canvas>
        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <h2 id="overlay-title">Game over</h2>
            <p id="overlay-score"></p>
            <form id="save-form" class="hidden">
              <label for="player-name">Name</label>
              <input id="player-name" type="text" maxlength="20" required
                     autocomplete="off" placeholder="Your name">
              <button type="submit">Save score</button>
            </form>
            <p id="save-status" class="status"></p>
            <button id="restart-btn" class="primary">Play again</button>
          </div>
        </div>
      </div>
      <p id="power-status" class="power-status hidden"></p>
      <p class="hint">Arrows / WASD to move &middot; Space to pause</p>
      <p class="scoreline">Score: <span id="score">0</span> &middot;
        Board leader: <span id="best">&ndash;</span></p>
    </section>

    <aside class="scores-panel">
      <h2>High scores</h2>
      <ol id="highscores"></ol>
    </aside>
  </main>

  <script>
    // Snake — all game logic lives in this file. The server (app.py)
    // only stores the shared high-score board, so the page also works
    // when opened directly as a file (no server: high scores just won't
    // be saved).

    const GRID = 20;           // cells per side
    const CELL = 20;           // px per cell
    const BASE_SPEED_MS = 120; // tick interval at the start
    const MIN_SPEED_MS = 60;   // fastest tick
    const SPEEDUP_PER_FOOD = 3; // ms shaved off per food eaten
    const POINTS_PER_FOOD = 10;

    // Power-ups. "life" is the effect duration in ticks; 0 means the
    // effect is instant. Colors double as the snake tint while active.
    const POWER_TYPES = {
      slow:   { label: "SLOW-MO",   glyph: "S",  color: "#60a5fa", life: 40 },
      ghost:  { label: "GHOST",     glyph: "G",  color: "#22d3ee", life: 40 },
      double: { label: "2x POINTS", glyph: "2x", color: "#facc15", life: 64 },
      shrink: { label: "SHRINK",    glyph: "-",  color: "#f472b6", life: 0 },
    };
    const POWER_LIFE_BOARD = 50; // ticks a power-up stays on the board
    const POWER_CHANCE = 0.3;    // chance of one spawning per food eaten
    const SHRINK_CELLS = 3;

    // When served by app.py the API is same-origin; when this page is
    // opened directly (file://), talk to the local server explicitly.
    const API_BASE =
      location.protocol === "http:" || location.protocol === "https:"
        ? ""
        : "http://127.0.0.1:8000";

    // ---- Sound: tiny Web Audio synth, no asset files. The AudioContext
    // is created lazily on the first sound (browsers require a user
    // gesture first); if audio is unavailable everything is a no-op. ----
    let audioCtx = null;
    let muted = localStorage.getItem("snake-muted") === "1";

    function ensureAudio() {
      if (muted) return null;
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      } catch {
        return null;
      }
    }

    function beep({ freq = 440, end = freq, dur = 0.08, type = "square", gain = 0.04, delay = 0 }) {
      const ctx = ensureAudio();
      if (!ctx) return;
      try {
        const t0 = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (end !== freq) osc.frequency.exponentialRampToValueAtTime(end, t0 + dur);
        g.gain.setValueAtTime(gain, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g).connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      } catch {
        // Never let a bleep take the game down.
      }
    }

    function sound(name) {
      switch (name) {
        case "eat":
          beep({ freq: 660, dur: 0.07, type: "square" });
          break;
        case "spawn":
          beep({ freq: 880, dur: 0.05, type: "triangle", gain: 0.02 });
          break;
        case "power":
          beep({ freq: 523, dur: 0.07, type: "triangle" });
          beep({ freq: 784, dur: 0.09, type: "triangle", delay: 0.07 });
          break;
        case "shrink":
          beep({ freq: 300, end: 120, dur: 0.15, type: "sawtooth" });
          break;
        case "die":
          beep({ freq: 220, end: 55, dur: 0.4, type: "sawtooth", gain: 0.05 });
          break;
        case "win":
          [523, 659, 784, 1047].forEach((f, i) =>
            beep({ freq: f, dur: 0.12, type: "triangle", delay: i * 0.1 })
          );
          break;
        case "pause":
          beep({ freq: 440, dur: 0.04, type: "sine", gain: 0.03 });
          break;
      }
    }

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayScore = document.getElementById("overlay-score");
    const saveForm = document.getElementById("save-form");
    const nameInput = document.getElementById("player-name");
    const saveStatus = document.getElementById("save-status");
    const restartBtn = document.getElementById("restart-btn");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const listEl = document.getElementById("highscores");
    const powerStatusEl = document.getElementById("power-status");
    const muteBtn = document.getElementById("mute-btn");

    const UP = { x: 0, y: -1 };
    const DOWN = { x: 0, y: 1 };
    const LEFT = { x: -1, y: 0 };
    const RIGHT = { x: 1, y: 0 };

    let snake, dir, dirQueue, food, score, tickMs, timer;
    let started, paused, gameOver;
    let powerUp; // {x, y, type, left} — on the board, or null
    let active;  // {type, left} — effect currently applied, or null

    // Rendering: the logic ticks discretely, but drawing interpolates
    // between the pre-step snapshot (prevSnake) and the current position,
    // and particles are updated every animation frame.
    let prevSnake = null;
    let lastStepAt = 0;
    let lastInterval = BASE_SPEED_MS;
    let particles = [];

    function reset() {
      const mid = Math.floor(GRID / 2);
      snake = [
        { x: mid, y: mid },
        { x: mid - 1, y: mid },
        { x: mid - 2, y: mid },
      ];
      dir = RIGHT;
      dirQueue = [];
      score = 0;
      tickMs = BASE_SPEED_MS;
      started = false;
      paused = false;
      gameOver = false;
      powerUp = null;
      active = null;
      prevSnake = null;
      particles = [];
      lastStepAt = performance.now();
      lastInterval = BASE_SPEED_MS;
      food = placeFood();
      scoreEl.textContent = "0";
      hideOverlay();
      draw();
    }

    function placeFood() {
      const free = [];
      for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
          if (
            !snake.some((s) => s.x === x && s.y === y) &&
            !(powerUp && powerUp.x === x && powerUp.y === y)
          ) {
            free.push({ x, y });
          }
        }
      }
      return free[Math.floor(Math.random() * free.length)];
    }

    function pickPowerType() {
      const r = Math.random();
      if (r < 0.3) return "slow";
      if (r < 0.6) return "ghost";
      if (r < 0.9) return "double";
      return "shrink";
    }

    // Called when a food is eaten: with POWER_CHANCE a power-up appears
    // on a free cell. Returns null when nothing spawns.
    function spawnPowerUp() {
      const type = pickPowerType();
      const free = [];
      for (let x = 0; x < GRID; x++) {
        for (let y = 0; y < GRID; y++) {
          if (
            !snake.some((s) => s.x === x && s.y === y) &&
            !(food.x === x && food.y === y)
          ) {
            free.push({ x, y });
          }
        }
      }
      if (!free.length) return null;
      const cell = free[Math.floor(Math.random() * free.length)];
      return { ...cell, type, left: POWER_LIFE_BOARD };
    }

    function applyPower(type) {
      if (type === "shrink") {
        // Instant: lose SHRINK_CELLS, but never the last segment.
        const cut = Math.min(SHRINK_CELLS, snake.length - 1);
        for (let i = 0; i < cut; i++) snake.pop();
      } else {
        active = { type, left: POWER_TYPES[type].life };
      }
    }

    function queueDir(d) {
      if (!started && !paused && !gameOver) {
        started = true;
      }
      const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
      // Ignore no-ops and 180-degree reversals.
      if (d.x === last.x && d.y === last.y) return;
      if (d.x === -last.x && d.y === -last.y) return;
      if (dirQueue.length < 3) dirQueue.push(d);
    }

    function cellCenter(c) {
      return { x: c.x * CELL + CELL / 2, y: c.y * CELL + CELL / 2 };
    }

    function step() {
      if (active) {
        active.left--;
        if (active.left <= 0) active = null;
      }
      if (powerUp) {
        powerUp.left--;
        if (powerUp.left <= 0) powerUp = null;
      }

      if (dirQueue.length) dir = dirQueue.shift();

      const ghost = active && active.type === "ghost";
      let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (ghost) {
        // Ghost: wrap around walls.
        head.x = (head.x + GRID) % GRID;
        head.y = (head.y + GRID) % GRID;
      }

      const eats = head.x === food.x && head.y === food.y;
      const eatsPower = !!powerUp && head.x === powerUp.x && head.y === powerUp.y;

      // Walls kill (unless ghost); the tail cell is safe to enter unless
      // we grow; ghost passes through its own body.
      const body = eats ? snake : snake.slice(0, -1);
      const hitWall =
        head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
      if (hitWall || (!ghost && body.some((s) => s.x === head.x && s.y === head.y))) {
        gameOver = true;
        sound("die");
        showGameOver();
        return;
      }

      snake.unshift(head);
      if (eats) {
        sound("eat");
        const c = cellCenter(food);
        spawnBurst(c.x, c.y, "#f87171", 10);
        const double = active && active.type === "double";
        score += double ? POINTS_PER_FOOD * 2 : POINTS_PER_FOOD;
        scoreEl.textContent = String(score);
        tickMs = Math.max(MIN_SPEED_MS, tickMs - SPEEDUP_PER_FOOD);
        food = placeFood();
        if (powerUp === null && Math.random() < POWER_CHANCE) {
          powerUp = spawnPowerUp();
          if (powerUp) sound("spawn");
        }
        if (snake.length === GRID * GRID) {
          gameOver = true;
          sound("win");
          showGameOver("You win!");
          return;
        }
      } else if (eatsPower) {
        // Power-ups don't grow the snake.
        const type = powerUp.type;
        const c = cellCenter(powerUp);
        spawnBurst(c.x, c.y, POWER_TYPES[type].color, 14);
        powerUp = null;
        snake.pop();
        applyPower(type);
        sound(type === "shrink" ? "shrink" : "power");
      } else {
        snake.pop();
      }
      draw();
    }

    function currentInterval() {
      return active && active.type === "slow" ? tickMs * 2 : tickMs;
    }

    function tick() {
      if (started && !paused && !gameOver) {
        prevSnake = snake.map((c) => ({ ...c }));
        lastStepAt = performance.now();
        lastInterval = currentInterval();
        step();
      }
      if (!gameOver) scheduleTick();
    }

    function scheduleTick() {
      clearTimeout(timer);
      timer = setTimeout(tick, currentInterval());
    }

    function start() {
      clearTimeout(timer);
      reset();
      scheduleTick();
    }

    function draw(now) {
      if (now === undefined) now = performance.now();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Faint grid lines.
      ctx.strokeStyle = "rgba(148, 163, 184, 0.08)";
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL + 0.5, 0);
        ctx.lineTo(i * CELL + 0.5, canvas.height);
        ctx.moveTo(0, i * CELL + 0.5);
        ctx.lineTo(canvas.width, i * CELL + 0.5);
        ctx.stroke();
      }

      // Food.
      ctx.fillStyle = "#f87171";
      ctx.beginPath();
      ctx.arc(
        food.x * CELL + CELL / 2,
        food.y * CELL + CELL / 2,
        CELL / 2 - 3,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Power-up on the board: colored circle with its glyph.
      if (powerUp) {
        const def = POWER_TYPES[powerUp.type];
        const cx = powerUp.x * CELL + CELL / 2;
        const cy = powerUp.y * CELL + CELL / 2;
        ctx.fillStyle = def.color;
        ctx.beginPath();
        ctx.arc(cx, cy, CELL / 2 - 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 11px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(def.glyph, cx, cy + 1);
      }

      // Snake: tinted by the active effect, otherwise green. Each segment
      // glides from its pre-step cell to its current one; jumps bigger
      // than a cell (ghost wrap, shrink) snap instead of sliding.
      const t = prevSnake
        ? Math.min(1, (now - lastStepAt) / Math.max(1, lastInterval))
        : 1;
      const tint = active ? POWER_TYPES[active.type].color : null;
      snake.forEach((seg, i) => {
        const prev = prevSnake && prevSnake[i];
        let x = seg.x, y = seg.y;
        if (prev && Math.abs(prev.x - x) + Math.abs(prev.y - y) <= 1) {
          x = prev.x + (x - prev.x) * t;
          y = prev.y + (y - prev.y) * t;
        }
        ctx.fillStyle = tint ?? (i === 0 ? "#4ade80" : "#22c55e");
        ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
      });

      // Particles (eat / power-up bursts).
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.left / p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (p.left / p.life) + 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      updatePowerStatus();
    }

    function spawnBurst(x, y, color, n = 12) {
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 90; // px/s
        const life = 0.4 + Math.random() * 0.2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 2 + Math.random() * 2,
          life,
          left: life,
          color,
        });
      }
    }

    function updateParticles(dt) {
      for (const p of particles) {
        p.left -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      particles = particles.filter((p) => p.left > 0);
    }

    let lastFrameAt = 0;
    function frame(now) {
      if (now === undefined) now = performance.now();
      const dt = Math.min(0.05, (now - lastFrameAt) / 1000);
      lastFrameAt = now;
      if (dt > 0) updateParticles(dt);
      draw(now);
      requestAnimationFrame(frame);
    }

    function updatePowerStatus() {
      if (active) {
        const def = POWER_TYPES[active.type];
        powerStatusEl.textContent = `${def.label} ${active.left}`;
        powerStatusEl.style.color = def.color;
        powerStatusEl.classList.remove("hidden");
      } else if (powerUp) {
        powerStatusEl.textContent = "Power-up on the board!";
        powerStatusEl.style.color = POWER_TYPES[powerUp.type].color;
        powerStatusEl.classList.remove("hidden");
      } else {
        powerStatusEl.textContent = "";
        powerStatusEl.classList.add("hidden");
      }
    }

    function showGameOver(title = "Game over") {
      overlayTitle.textContent = title;
      overlayScore.textContent = `Final score: ${score}`;
      saveForm.classList.toggle("hidden", score < POINTS_PER_FOOD);
      saveStatus.textContent = "";
      overlay.classList.remove("hidden");
      nameInput.focus();
    }

    function hideOverlay() {
      overlay.classList.add("hidden");
    }

    function setMuted(m) {
      muted = m;
      muteBtn.textContent = muted ? "\u{1F507}" : "\u{1F50A}";
      muteBtn.title = muted ? "Sound off — press M to enable" : "Sound on — press M to mute";
      try {
        localStorage.setItem("snake-muted", muted ? "1" : "0");
      } catch {
        // Storage unavailable (e.g. some private modes); just play on.
      }
    }

    function toggleMute() {
      setMuted(!muted);
      if (!muted) sound("pause"); // confirmation blip
    }

    function togglePause() {
      if (!started || gameOver) return;
      paused = !paused;
      sound("pause");
      if (paused) {
        overlayTitle.textContent = "Paused";
        overlayScore.textContent = "Press Space to resume";
        saveForm.classList.add("hidden");
        saveStatus.textContent = "";
        overlay.classList.remove("hidden");
      } else {
        hideOverlay();
      }
    }

    window.addEventListener("keydown", (e) => {
      const keys = {
        ArrowUp: UP, w: UP, W: UP,
        ArrowDown: DOWN, s: DOWN, S: DOWN,
        ArrowLeft: LEFT, a: LEFT, A: LEFT,
        ArrowRight: RIGHT, d: RIGHT, D: RIGHT,
      };
      if (keys[e.key]) {
        e.preventDefault();
        if (gameOver) return;
        queueDir(keys[e.key]);
        if (paused) togglePause();
        return;
      }
      if (e.key === " ") {
        e.preventDefault();
        togglePause();
      } else if (e.key === "Enter" && gameOver) {
        start();
      } else if ((e.key === "m" || e.key === "M") && e.target !== nameInput) {
        toggleMute();
      }
    });

    restartBtn.addEventListener("click", start);
    muteBtn.addEventListener("click", toggleMute);

    saveForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      saveStatus.textContent = "Saving…";
      const name = nameInput.value.trim();
      try {
        const res = await fetch(`${API_BASE}/api/highscores`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, score }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        localStorage.setItem("snake-name", name);
        saveStatus.textContent = "Saved!";
        saveForm.classList.add("hidden");
        await loadHighscores();
      } catch {
        saveStatus.textContent = "Could not save — is the server running?";
      }
    });

    async function loadHighscores() {
      try {
        const res = await fetch(`${API_BASE}/api/highscores`);
        const scores = await res.json();
        bestEl.textContent = scores.length ? String(scores[0].score) : "–";
        listEl.innerHTML = "";
        if (!scores.length) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "No scores yet";
          listEl.appendChild(li);
          return;
        }
        for (const s of scores) {
          const li = document.createElement("li");
          const name = document.createElement("span");
          name.textContent = s.name;
          const sc = document.createElement("span");
          sc.className = "score";
          sc.textContent = String(s.score);
          li.append(name, sc);
          listEl.appendChild(li);
        }
      } catch {
        bestEl.textContent = "–";
      }
    }

    // Restore the player's name from a previous session.
    nameInput.value = localStorage.getItem("snake-name") ?? "";
    setMuted(muted);

    start();
    loadHighscores();
    lastFrameAt = performance.now();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
